[project]
name = "ideaforge"
version = "0.1.0"
description = "AI-powered Startup Survival Simulator"
requires-python = ">=3.12,<3.14"
dependencies = [
    # ── Web framework ────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # ── Database ─────────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",           # async PostgreSQL driver
    "neo4j>=5.25.0",             # official Neo4j async driver

    # ── Agent workflow ───────────────────────────────────────────────────────────
    "langgraph>=0.2.0",

    # ── LLM providers ────────────────────────────────────────────────────────────
    # Primary: OpenAI GPT (orchestration, complex reasoning)
    "langchain-openai>=0.3.0",
    # Secondary: Google Gemini 2.5 (generation, evaluation)
    "langchain-google-genai>=2.0.0",
    # Secondary: Groq + Llama 3.3 (fast inference, scoring)
    "langchain-groq>=0.2.0",

    # ── Observability ─────────────────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── Validation ───────────────────────────────────────────────────────────────
    "email-validator>=2.2.0",      # required for Pydantic EmailStr

    # ── RAG — document ingestion + vector retrieval ───────────────────────────
    "pgvector>=0.3.0",                       # pgvector SQLAlchemy/asyncpg support
    "langchain-text-splitters>=0.3.0",      # RecursiveCharacterTextSplitter
    "pypdf>=4.3.0",                         # PDF text extraction (Tier 1)
    "pymupdf>=1.24.0",                      # PDF->PNG rendering for Vision fallback
    "beautifulsoup4>=4.12.0",               # HTML parsing
    "lxml>=5.3.0",                          # fast C-based HTML parser for bs4
    "python-multipart>=0.0.12",             # FastAPI UploadFile support

    # ── Agentic web search ────────────────────────────────────────────────────
    "duckduckgo-search>=6.0.0",              # free market research, no API key

    # ── MCP server ───────────────────────────────────────────────────────────
    "mcp[cli]>=1.0.0",                       # Anthropic MCP Python SDK
    "httpx>=0.27.0",                         # async HTTP client for MCP tools
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideaforge"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: tests that make real LLM API calls (deselect with -m 'not llm')",
    "db: tests that require a live PostgreSQL database",
]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
